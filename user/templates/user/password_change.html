{% extends 'vet/base.html' %}
{% load crispy_forms_tags %}
{% block main %}
<div class="container mt-5">
  <div class="card">
    <div class="card-body">
      <h4 class="card-title">Change Your Password</h4>
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-3">
          <button type="submit" class="btn btn-success">Change Password</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

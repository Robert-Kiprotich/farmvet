{% extends 'vet/base.html' %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header bg-success text-white">
          <h4 class="card-title mb-0">Password Reset Successful</h4>
        </div>
        <div class="card-body text-center">
          <div class="alert alert-success">
            <i class="fas fa-check-circle fa-3x mb-3"></i>
            <p class="mb-0">Your password has been set. You may go ahead and log in now.</p>
          </div>
          <a href="{% url 'index' %}" class="btn btn-primary">Back Home</a>
          <a href="{% url 'login' %}" class="btn btn-success">Log In</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

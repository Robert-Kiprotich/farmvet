{% extends 'vet/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="card-title mb-10">Forgot Password</h4>
        </div>
        <div class="card-body">
          <p class="text-muted">Enter your email address below, and we'll send you instructions for setting a new password.</p>
          <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="mt-3">
              <button type="submit" class="btn btn-primary">Send Reset Email</button>
                <a href="{% url 'login' %}" class="btn btn-secondary">Back to Login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<br>
{% endblock %}
